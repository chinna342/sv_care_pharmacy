<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Silver Foil Front Gradient -->
    <linearGradient id="silverFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Dolo Blue Blister Back Gradient -->
    <linearGradient id="doloBlueBlister" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- 3D Pill Pocket Dome Gradient -->
    <radialGradient id="pillPocket3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <!-- Soft 3D Drop Shadow -->
    <filter id="packShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <filter id="pocketInnerGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="400" rx="20" fill="url(#bgLight)" />

  <!-- ============================================================ -->
  <!-- LEFT STRIP: FRONT SIDE (SILVER FOIL WITH DOLO-650 TEXT) -->
  <!-- ============================================================ -->
  <g transform="translate(60, 45)" filter="url(#packShadow)">
    <!-- Base Silver Foil Sheet -->
    <rect x="0" y="0" width="200" height="310" rx="14" fill="url(#silverFoil)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Left & Right Blue Edge Security Stripes -->
    <rect x="5" y="0" width="10" height="310" fill="#0284c7" opacity="0.85" />
    <rect x="185" y="0" width="10" height="310" fill="#0284c7" opacity="0.85" />

    <!-- Vertical Side Text -->
    <text x="12" y="150" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8" fill="#ffffff" transform="rotate(-90, 12, 150)" letter-spacing="1">DOLO-650</text>
    <text x="192" y="150" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8" fill="#ffffff" transform="rotate(90, 192, 150)" letter-spacing="1">MICRO LABS</text>

    <!-- Top Unit Text Block -->
    <g transform="translate(25, 25)">
      <text x="75" y="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#0f172a" text-anchor="middle">Paracetamol</text>
      <text x="75" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#0f172a" text-anchor="middle">Tablets IP</text>
      
      <!-- Brand Name Red/Orange Banner -->
      <text x="75" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#dc2626" text-anchor="middle" letter-spacing="-0.5">Dolo-650<tspan font-size="11" dy="-6">®</tspan></text>
      
      <text x="75" y="64" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#475569" text-anchor="middle">डोलो-६५०</text>

      <line x1="10" y1="74" x2="140" y2="74" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2" />
    </g>

    <!-- Middle Unit Details Block -->
    <g transform="translate(25, 115)">
      <text x="75" y="10" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="7" fill="#334155" text-anchor="middle">Each uncoated tablet contains:</text>
      <text x="75" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8" fill="#0369a1" text-anchor="middle">Paracetamol IP 650 mg</text>
      <text x="75" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#64748b" text-anchor="middle">Dosage: As directed by Physician</text>
      
      <!-- Middle Brand Block -->
      <text x="75" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#dc2626" text-anchor="middle">Dolo-650</text>
      <text x="75" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9" fill="#0f172a" text-anchor="middle">Paracetamol 650mg</text>

      <line x1="10" y1="74" x2="140" y2="74" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2" />
    </g>

    <!-- Bottom Manufacturer Logo Block -->
    <g transform="translate(25, 210)">
      <text x="75" y="12" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9" fill="#dc2626" text-anchor="middle">Dolo-650</text>
      <text x="75" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#334155" text-anchor="middle">Mfg. Lic. No. M/741/2016</text>
      
      <rect x="25" y="35" width="100" height="28" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1" />
      <text x="75" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8.5" fill="#0369a1" text-anchor="middle">MICRO LABS LIMITED</text>
      <text x="75" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="6" fill="#64748b" text-anchor="middle">92, SIPCOT, HOSUR - 635 126</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT STRIP: BACK SIDE (ICONIC BLUE 15-TABLET BLISTER SHEET) -->
  <!-- ============================================================ -->
  <g transform="translate(340, 45)" filter="url(#packShadow)">
    <!-- Base Blue Blister Sheet -->
    <rect x="0" y="0" width="200" height="310" rx="14" fill="url(#doloBlueBlister)" stroke="#0284c7" stroke-width="1.5" />

    <!-- 15 Blister Pockets (3 Columns x 5 Rows) -->
    <!-- Row 1 -->
    <circle cx="45" cy="40" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="40" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="100" cy="40" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="40" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <circle cx="155" cy="40" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="155" cy="40" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <!-- Row 2 -->
    <circle cx="45" cy="98" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="98" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="100" cy="98" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="98" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <circle cx="155" cy="98" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="155" cy="98" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <!-- Row 3 -->
    <circle cx="45" cy="155" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="155" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="100" cy="155" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="155" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <circle cx="155" cy="155" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="155" cy="155" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <!-- Row 4 -->
    <circle cx="45" cy="212" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="212" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="100" cy="212" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="212" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <circle cx="155" cy="212" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="155" cy="212" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <!-- Row 5 -->
    <circle cx="45" cy="270" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="270" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="100" cy="270" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="270" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />

    <circle cx="155" cy="270" r="22" fill="url(#pillPocket3D)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="155" cy="270" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>